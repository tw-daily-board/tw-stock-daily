name: daily-update

on:
  schedule:
    # 台灣時間 週一~五三次（UTC 07:13 / 08:43 / 12:57）：
    # 15:13 期貨資料（期交所約 15:20 公布，程式內每 5 分鐘重試，最多等 45 分鐘）；
    #       股票三大法人資料較晚，若還沒出就沿用舊的股票資料。
    # 16:43 股票盤後資料（三大法人約 16:20 公布）；若還沒公布會在程式內每 10 分鐘重試，最多等 60 分鐘。
    # 20:57 綜合訊號（含融資融券，晚間公布；沒出就每 10 分鐘重試，最多等 60 分鐘），也順便取得修正後的成交量值。
    - cron: "13 7 * * 1-5"
    - cron: "43 8 * * 1-5"
    - cron: "57 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取盤後資料
        env:
          FUT_WAIT_MINUTES: ${{ github.event.schedule == '13 7 * * 1-5' && '45' || '0' }}
          STOCK_WAIT_MINUTES: ${{ github.event.schedule == '43 8 * * 1-5' && '60' || '0' }}
          MARGIN_WAIT_MINUTES: ${{ github.event.schedule == '57 12 * * 1-5' && '60' || '0' }}
          # 這次排程負責的資料：最後還是沒抓到今天的就讓流程失敗（手動執行不檢查）
          REQUIRE: ${{ github.event.schedule == '13 7 * * 1-5' && 'fut' || github.event.schedule == '43 8 * * 1-5' && 'stock' || github.event.schedule == '57 12 * * 1-5' && 'margin' || '' }}
        run: python scripts/fetch_data.py
      - name: 提交資料
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 盤後更新"
          # 執行期間 main 可能有新的提交（程式修改或另一次執行）：先同步再推，資料衝突以這次抓到的為準
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - name: 打包網站
        if: ${{ !cancelled() }}
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/
          # 加上版本號，避免瀏覽器用到舊的 app.js／style.css（新舊混用會讓頁面壞掉）
          sed -i "s#style.css\"#style.css?v=${GITHUB_SHA::7}\"#; s#app.js\"#app.js?v=${GITHUB_SHA::7}\"#" _site/index.html
          grep -q "app.js?v=" _site/index.html
          rm -rf _site/data/inst _site/data/fut _site/data/history _site/data/market _site/data/chips _site/data/quotes _site/data/revenue _site/data/valhist
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}
