name: daily-update

on:
  schedule:
    # 台灣時間 週一~五兩次（UTC 07:13 / 10:00）：
    # 15:13 期貨資料（期交所約 15:20 公布，程式內每 5 分鐘重試，最多等 45 分鐘）；
    #       股票三大法人資料較晚，若還沒出就沿用舊的股票資料。
    # 18:00 股票完整盤後資料；若還沒公布會在程式內每 10 分鐘重試，最多等 60 分鐘。
    - cron: "13 7 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取盤後資料
        env:
          FUT_WAIT_MINUTES: ${{ github.event.schedule == '13 7 * * 1-5' && '45' || '0' }}
          STOCK_WAIT_MINUTES: ${{ github.event.schedule == '0 10 * * 1-5' && '60' || '0' }}
        run: python scripts/fetch_data.py
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 盤後更新"
          # 執行期間 main 可能有新的提交（程式修改或另一次執行）：先同步再推，資料衝突以這次抓到的為準
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/configure-pages@v5
      - name: 打包網站
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/
          rm -rf _site/data/inst _site/data/fut _site/data/history _site/data/market
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
