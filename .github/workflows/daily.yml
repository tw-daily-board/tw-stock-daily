name: daily-update

on:
  schedule:
    # 台灣時間 週一~五 17:30 與 19:30（UTC 09:30 / 11:30）。後者為法人資料延遲公布時的重試。
    - cron: "30 9,11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取盤後資料
        run: python scripts/fetch_data.py
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 盤後更新"
          git push
      - uses: actions/configure-pages@v5
      - name: 打包網站
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/
          rm -rf _site/data/inst _site/data/fut
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
