name: daily-update

on:
  schedule:
    # 盤前：台灣時間週一~五 05:47（UTC 前一天 21:47，所以是週日~週四）：夜盤、匯率、國際市場、今日事件、昨晚重大訊息
    #       GitHub 排程常延遲 15 分鐘到 1 小時以上，所以提早跑，並在 06:47、07:17 各再跑一次（只更新盤前，重跑無害，
    #       也順便更新美股期貨等最新價）。夜盤還沒出就每 5 分鐘重試，最多等 45 分鐘。避開整點（整點最擁擠、延遲最久）
    - cron: "47 21 * * 0-4"
    - cron: "47 22 * * 0-4"
    - cron: "17 23 * * 0-4"
    # 盤後：台灣時間 週一~五三次（UTC 07:13 / 08:43 / 12:57）：
    # 15:13 期貨資料（期交所約 15:20 公布，程式內每 5 分鐘重試，最多等 45 分鐘）；
    #       股票三大法人資料較晚，若還沒出就沿用舊的股票資料。
    # 16:43 股票盤後資料（三大法人約 16:20 公布）；若還沒公布會在程式內每 10 分鐘重試，最多等 60 分鐘。
    # 20:57 綜合訊號（含融資融券，晚間公布；沒出就每 10 分鐘重試，最多等 60 分鐘），也順便取得修正後的成交量值。
    - cron: "13 7 * * 1-5"
    - cron: "43 8 * * 1-5"
    - cron: "57 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto＝台灣時間 09:00 前跑盤前、其他時間跑盤後完整更新；pre＝只跑盤前；full＝盤後完整更新"
        type: choice
        options: [auto, pre, full]
        default: auto
      slot:
        description: "外部定時服務（cron-job.org）用：這次負責的工作 pre＝盤前、fut＝期貨、stock＝股票、margin＝融資；none＝一般手動執行"
        type: choice
        options: [none, pre, fut, stock, margin]
        default: none

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 這次負責哪一段：GitHub 排程依 cron 判斷；外部定時服務（cron-job.org）用 workflow_dispatch 的 slot 指定
      - name: 決定這次的工作
        id: job
        env:
          SCHED: ${{ github.event.schedule }}
          SLOT_IN: ${{ inputs.slot }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          case "$SCHED" in
            "47 21 * * 0-4"|"47 22 * * 0-4"|"17 23 * * 0-4") slot=pre ;;
            "13 7 * * 1-5") slot=fut ;;
            "43 8 * * 1-5") slot=stock ;;
            "57 12 * * 1-5") slot=margin ;;
            *) slot="$SLOT_IN" ;;
          esac
          [ "$slot" = "none" ] && slot=""
          mode="$MODE_IN"; pre=0; fut=0; stock=0; margin=0
          case "$slot" in
            pre) mode=pre; pre=45 ;;
            fut) mode=full; fut=45 ;;
            stock) mode=full; stock=60 ;;
            margin) mode=full; margin=60 ;;
          esac
          echo "這次的工作：${slot:-一般手動執行}（mode=${mode:-full}）"
          { echo "require=$slot"; echo "mode=$mode"; echo "pre=$pre"; echo "fut=$fut"; echo "stock=$stock"; echo "margin=$margin"; } >> "$GITHUB_OUTPUT"
      - name: 抓取盤後資料
        env:
          FUT_WAIT_MINUTES: ${{ steps.job.outputs.fut }}
          STOCK_WAIT_MINUTES: ${{ steps.job.outputs.stock }}
          MARGIN_WAIT_MINUTES: ${{ steps.job.outputs.margin }}
          PRE_WAIT_MINUTES: ${{ steps.job.outputs.pre }}
          MODE: ${{ steps.job.outputs.mode }}
          # 這次負責的資料：最後還是沒抓到今天的就讓流程失敗（一般手動執行不檢查）
          REQUIRE: ${{ steps.job.outputs.require }}
        run: python scripts/fetch_data.py
      - name: 提交資料
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 盤後更新"
          # 執行期間 main 可能有新的提交（程式修改或另一次執行）：先同步再推，資料衝突以這次抓到的為準
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/configure-pages@v6
        if: ${{ !cancelled() }}
      - name: 打包網站
        if: ${{ !cancelled() }}
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/
          # 加上版本號，避免瀏覽器用到舊的 app.js／style.css（新舊混用會讓頁面壞掉）
          sed -i "s#style.css\"#style.css?v=${GITHUB_SHA::7}\"#; s#app.js\"#app.js?v=${GITHUB_SHA::7}\"#" _site/index.html
          grep -q "app.js?v=" _site/index.html
          rm -rf _site/data/inst _site/data/fut _site/data/history _site/data/market _site/data/chips _site/data/quotes _site/data/revenue _site/data/valhist _site/data/news _site/data/sbl _site/data/tdcc _site/data/trend
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() }}
