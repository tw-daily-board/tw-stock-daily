name: daily-update

on:
  # 主要排程由外部定時服務 cron-job.org 準時觸發（GitHub 自己的排程常延遲 30 分鐘～2 小時，甚至略過）：
  #   台灣時間週一~五 06:10 盤前（slot=pre）、15:15 期貨（fut）、17:00 股票（stock）、21:00 融資等晚間資料（margin）
  #   用 workflow_dispatch API 帶 slot 參數；權杖只有這個 repo 的 Actions 讀寫權限，存放在 cron-job.org。
  # 這裡只留一個 GitHub 排程當保險：台灣時間週一~五 22:17（UTC 14:17）補跑一次完整更新，
  # 不檢查必要資料（即使延遲到半夜也不會誤報）；報錯交給 cron-job.org 的四次。
  schedule:
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto＝台灣時間 09:00 前跑盤前、其他時間跑盤後完整更新；pre＝只跑盤前；full＝盤後完整更新"
        type: choice
        options: [auto, pre, full]
        default: auto
      slot:
        description: "外部定時服務（cron-job.org）用：這次負責的工作 pre＝盤前、fut＝期貨、stock＝股票、margin＝融資；none＝一般手動執行"
        type: choice
        options: [none, pre, fut, stock, margin]
        default: none

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 這次負責哪一段：外部定時服務（cron-job.org）用 workflow_dispatch 的 slot 指定
      - name: 決定這次的工作
        id: job
        env:
          SCHED: ${{ github.event.schedule }}
          SLOT_IN: ${{ inputs.slot }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          # GitHub 保險排程（22:17）：slot 空白＝只補跑完整更新、不檢查必要資料；其餘由 workflow_dispatch 的 slot 決定
          if [ -n "$SCHED" ]; then slot=""; else slot="$SLOT_IN"; fi
          [ "$slot" = "none" ] && slot=""
          mode="$MODE_IN"; pre=0; fut=0; stock=0; margin=0
          case "$slot" in
            pre) mode=pre; pre=45 ;;
            fut) mode=full; fut=45 ;;
            stock) mode=full; stock=60 ;;
            margin) mode=full; margin=60 ;;
          esac
          echo "這次的工作：${slot:-一般手動執行}（mode=${mode:-full}）"
          { echo "require=$slot"; echo "mode=$mode"; echo "pre=$pre"; echo "fut=$fut"; echo "stock=$stock"; echo "margin=$margin"; } >> "$GITHUB_OUTPUT"
      - name: 抓取盤後資料
        env:
          FUT_WAIT_MINUTES: ${{ steps.job.outputs.fut }}
          STOCK_WAIT_MINUTES: ${{ steps.job.outputs.stock }}
          MARGIN_WAIT_MINUTES: ${{ steps.job.outputs.margin }}
          PRE_WAIT_MINUTES: ${{ steps.job.outputs.pre }}
          MODE: ${{ steps.job.outputs.mode }}
          # 這次負責的資料：最後還是沒抓到今天的就讓流程失敗（一般手動執行不檢查）
          REQUIRE: ${{ steps.job.outputs.require }}
        run: python scripts/fetch_data.py
      - name: 提交資料
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 盤後更新"
          # 執行期間 main 可能有新的提交（程式修改或另一次執行）：先同步再推，資料衝突以這次抓到的為準
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/configure-pages@v6
        if: ${{ !cancelled() }}
      - name: 打包網站
        if: ${{ !cancelled() }}
        run: |
          mkdir _site
          cp -r index.html style.css app.js data _site/
          # 加上版本號，避免瀏覽器用到舊的 app.js／style.css（新舊混用會讓頁面壞掉）
          sed -i "s#style.css\"#style.css?v=${GITHUB_SHA::7}\"#; s#app.js\"#app.js?v=${GITHUB_SHA::7}\"#" _site/index.html
          grep -q "app.js?v=" _site/index.html
          rm -rf _site/data/inst _site/data/fut _site/data/history _site/data/market _site/data/chips _site/data/quotes _site/data/revenue _site/data/valhist _site/data/news _site/data/sbl _site/data/tdcc _site/data/trend
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() }}
